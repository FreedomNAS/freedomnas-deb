name: publish-packages

# Rebuilds the FreedomNAS packages and publishes them to Codeberg's Debian
# registry. Triggered manually, or by the component repositories'
# notify-deb-repo.yml on every push, the same way core/profiles/webui
# already trigger freedomnas-image-builder.
#
# Two kinds of build, and which one runs depends on the branch pushed:
#
#   dev   -> a snapshot, 0.9.10+<date and time>.<commit>, published to
#            the `dev` component. Every small change gets a version of
#            its own.
#   main  -> a release, built from the newest release tag (vX.Y.Z) at
#            the version debian/changelog names there, published to
#            `main`. Raising 0.9.10 to 0.9.11 is a deliberate edit to that
#            file, followed by a tag.
#
# An unchanged component is not a special case: the registry refuses a
# version it already holds, publish-codeberg.sh reports that and moves on.
#
# Three jobs, so that only the kernel needs the self-hosted runner:
#
#   packages     the FreedomNAS packages, topgrade, freedomnas-repository and
#                the community modules, on Codeberg's own runners: they are
#                published even when the self-hosted runner is off.
#   kernel-check whether this kernel version is already in the registry, on
#                Codeberg's smallest runner.
#   kernel       only when kernel-check says it is missing: the kernel takes
#                the better part of an hour and its ccache lives on the
#                self-hosted runner (`runs-on: docker`), see docs/ci-setup.md.
#
# Everything is plain HTTP and dpkg-buildpackage inside a Debian container,
# with no privileged access.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of the component repositories to build"
        type: string
        default: dev
  schedule:
    # A daily snapshot catches anything the push triggers missed.
    - cron: "17 4 * * *"

jobs:
  packages:
    runs-on: codeberg-medium
    container:
      image: debian:trixie
    env:
      REF: ${{ inputs.ref || 'dev' }}
    steps:
      - name: Install the packaging tooling
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl git nodejs rsync \
            build-essential dpkg-dev debhelper fakeroot \
            python3-all python3-setuptools pybuild-plugin-pyproject \
            mkdocs mkdocs-material python3-pymdownx

      - name: Check out freedomnas-deb
        uses: actions/checkout@v4
        with:
          path: freedomnas-deb

      # A release is built from the newest release tag (vX.Y.Z, the same
      # name in every FreedomNAS repository), not from the tip of main.
      - name: Pick the ref to build
        run: |
          ref="$REF"
          if [ "$ref" = main ]; then
            ref="$(git ls-remote --tags --refs https://codeberg.org/FreedomNAS/freedomnas-core.git 'v*' \
              | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)"
            [ -n "$ref" ] || { echo "no release tag on freedomnas-core" >&2; exit 1; }
          fi
          echo "Building $ref"
          echo "SRC_REF=$ref" >> "$GITHUB_ENV"

      - name: Check out the components
        run: |
          for repo in freedomnas-core freedomnas-profiles freedomnas-docs freedomnas-webui freedomnas-installer; do
            git clone --depth 50 --branch "$SRC_REF" \
              "https://codeberg.org/FreedomNAS/$repo.git" "$repo"
          done

      # Community modules have versions of their own: dev builds their dev
      # branch, main their own newest release tag, and a module with no tag
      # yet is left out of main.
      - name: Check out the community modules
        run: |
          modules=""
          for repo in freedomnas-containers; do
            url="https://codeberg.org/FreedomNAS/$repo.git"
            if [ "$REF" = main ]; then
              ref="$(git ls-remote --tags --refs "$url" 'v*' \
                | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)"
              [ -n "$ref" ] || { echo "$repo has no release tag yet: not built for main"; continue; }
            else
              ref=dev
            fi
            echo "Building $repo at $ref"
            git clone --depth 50 --branch "$ref" "$url" "$repo"
            modules="$modules $repo"
          done
          echo "MODULES=$modules" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd freedomnas-deb
          if [ "$REF" = "main" ]; then
              bin/build-freedomnas-debs.sh
              [ -z "$MODULES" ] || bin/build-freedomnas-debs.sh $MODULES
          else
              SNAPSHOT=1 bin/build-freedomnas-debs.sh
              [ -z "$MODULES" ] || SNAPSHOT=1 bin/build-freedomnas-debs.sh $MODULES
          fi
          # topgrade follows upstream, not our commits, and goes to both
          # components: an installation reads only one of them.
          bin/build-topgrade-deb.sh
          COMPONENT="$([ "$REF" = main ] && echo main || echo dev)" bin/build-repository-deb.sh

      - name: Publish
        env:
          CODEBERG_USER: ${{ secrets.PACKAGE_REGISTRY_USER }}
          CODEBERG_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: |
          cd freedomnas-deb
          COMPONENT="$([ "$REF" = main ] && echo main || echo dev)" bin/publish-codeberg.sh

      - name: Delete superseded versions
        env:
          CODEBERG_USER: ${{ secrets.PACKAGE_REGISTRY_USER }}
          CODEBERG_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: python3 freedomnas-deb/bin/prune-registry.py

  kernel-check:
    runs-on: codeberg-tiny-lazy
    container:
      image: debian:trixie
    env:
      REF: ${{ inputs.ref || 'dev' }}
    outputs:
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - name: Install the tooling
        run: apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl git

      - name: Check out freedomnas-deb and linux-freedomnas
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" freedomnas-deb
          git clone --depth 1 --branch dev https://codeberg.org/FreedomNAS/linux-freedomnas linux-freedomnas

      - name: Is this kernel version published?
        id: check
        run: |
          if CHECK_ONLY=1 COMPONENT="$([ "$REF" = main ] && echo main || echo dev)" \
              sh freedomnas-deb/bin/build-kernel-debs.sh "$PWD/linux-freedomnas"; then
            echo "missing=no" >> "$GITHUB_OUTPUT"
          else
            echo "missing=yes" >> "$GITHUB_OUTPUT"
          fi

  kernel:
    needs: kernel-check
    if: needs.kernel-check.outputs.missing == 'yes'
    runs-on: docker
    container:
      image: debian:trixie
      # The kernel's ccache, kept on the runner host between runs; the
      # runner's config.yaml must list it in valid_volumes.
      volumes:
        - /var/cache/freedomnas-ccache/debian:/ccache
    env:
      REF: ${{ inputs.ref || 'dev' }}
    steps:
      - name: Install the packaging tooling
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates ccache curl git nodejs rsync \
            build-essential dpkg-dev debhelper fakeroot python3

      - name: Check out freedomnas-deb
        uses: actions/checkout@v4
        with:
          path: freedomnas-deb

      - name: Check out linux-freedomnas
        run: git clone --depth 1 --branch dev https://codeberg.org/FreedomNAS/linux-freedomnas linux-freedomnas

      - name: Build the kernel
        run: |
          cd freedomnas-deb
          CCACHE_DIR=/ccache INSTALL_BUILD_DEPS=1 SKIP_PUBLISHED=1 COMPONENT="$([ "$REF" = main ] && echo main || echo dev)" \
              bin/build-kernel-debs.sh "$PWD/../linux-freedomnas"

      - name: Publish
        env:
          CODEBERG_USER: ${{ secrets.PACKAGE_REGISTRY_USER }}
          CODEBERG_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: |
          cd freedomnas-deb
          COMPONENT="$([ "$REF" = main ] && echo main || echo dev)" bin/publish-codeberg.sh

      - name: Delete superseded versions
        env:
          CODEBERG_USER: ${{ secrets.PACKAGE_REGISTRY_USER }}
          CODEBERG_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: python3 freedomnas-deb/bin/prune-registry.py
